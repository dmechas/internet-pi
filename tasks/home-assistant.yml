---
- name: Create Home Assistant folder on Pi.
  ansible.builtin.file:
    path: "{{ config_dir }}/homeassistant"
    state: directory
    mode: 0755
  become: false
  register: homeassistant_dir

- name: Copy Home Assistant docker-compose template to Pi.
  ansible.builtin.template:
    src: templates/homeassistant-docker-compose.yml.j2
    dest: "{{ homeassistant_dir.path }}/docker-compose.yml"
    mode: "0640"
  become: false
  notify: Restart homeassistant

# TODO: The first time this playbook is run, the `pi` user may not be added
# to the `docker` group, so this task may fail.
- name: Ensure Home Assistant is running.
  community.docker.docker_compose_v2:
    project_src: "{{ homeassistant_dir.path }}/"
    build: never
  become: false
