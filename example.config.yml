---
# Location where configuration files will be stored.
config_dir: '~'

# Domain names configuration (related services need to be enabled).
domain_name_enable: false
domain_name: 'home.local'
domain_pihole: 'pihole'          # to access pihole via: http://pihole.home.local
domain_grafana: 'grafana'        # to access grafana via: http://grafana.home.local
domain_prometheus: 'prometheus'  # to access prometheus via: http://prometheus.home.local

# Pi-hole configuration.
pihole_enable: true
pihole_hostname: pihole
pihole_timezone: America/Chicago
pihole_password: "change-this-password"

# Internet monitoring configuration.
monitoring_enable: true
monitoring_grafana_admin_password: "admin"
monitoring_speedtest_interval: 60m
monitoring_ping_interval: 5s
monitoring_ping_hosts:  # [URL];[HUMAN_READABLE_NAME]
  - http://www.google.com/;google.com
  - https://github.com/;github.com
  - https://www.apple.com/;apple.com

# Prometheus configuration.
prometheus_monitor_prometheus: false
prometheus_node_exporter_targets:
  - 'nodeexp:9100'
prometheus_extra_scrape_configs: ''
prometheus_tsdb_retention_time: 90d

# Shelly Plug configuration. (Also requires `monitoring_enable`)
shelly_plug_enable: false
shelly_plug_hostname: my-shelly-plug-host-or-ip
shelly_plug_http_username: username
shelly_plug_http_password: "password"

# AirGradient configuration. (Also requires `monitoring_enable`)
airgradient_enable: false
airgradient_sensors:
  # ID Should be limited to no more than 38 characters, in the set a-z.
  - id: livingroom
    ip: "192.168.0.123"
    port: 9925

# Starlink configuration. (Also requires `monitoring_enable`)
starlink_enable: false

# MikroTik (MKTXP) configuration. (Also requires `monitoring_enable`)
# Before enabling, create a read-only API user on the router and make sure the
# API service is enabled and reachable from the Pi (firewall permitting):
#   /user group add name=mktxp_group policy=api,read
#   /user add name=mktxp_user group=mktxp_group password=<strong-password>
#   /ip service enable api
# The exporter runs as uid 1000 inside its container, so the Ansible user on the
# Pi must be uid 1000 (the default on Raspberry Pi OS) for it to read mktxp.conf.
mktxp_enable: false
mktxp_router_name: my-router           # label used for the router in metrics
mktxp_router_hostname: 192.168.88.1
mktxp_router_username: mktxp_user
mktxp_router_password: "change-this-password"
# With use_ssl false the password crosses your LAN unencrypted on every scrape
# (plain API, port 8728). With true, API-SSL on 8729 is used, but the router's
# (usually self-signed) certificate is not verified.
mktxp_router_use_ssl: false
mktxp_router_api_port: "{{ 8729 if mktxp_router_use_ssl else 8728 }}"
mktxp_collect_routerboard: true        # firmware / RouterBOARD info
mktxp_collect_dns: true                # DNS cache stats (not shown in the dashboard)
mktxp_collect_wireless: false          # set true for routers with built-in WiFi
mktxp_collect_capsman: false           # set true if the router runs CAPsMAN
mktxp_collect_queue: false             # set true if you use simple queues / queue trees
